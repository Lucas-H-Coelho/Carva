## Notas de Implementação

- **Port binding:** Usar `127.0.0.1:5432:5432` para não expor ao network local
- **Redis memory:** Limitar a 256MB com `allkeys-lru` para evitar OOM
- **PostgreSQL:** Usar `alpine` para imagem menor (~30MB vs ~300MB)
- **Volumes:** Named volumes funcionam em Windows/Mac/Linux sem problemas de path
- **Health checks:** Essenciais para `docker compose up --wait` no futuro

---

## Riscos e Mitigações

| Risco | Mitigação |
|-------|-----------|
| Porta 5432 já em uso no host | Script verifica porta antes de iniciar |
| Container não inicia no boot | `restart: unless-stopped` no compose |
| Redis perde dados | `appendonly yes` + named volume |
| PostgreSQL não aceita conexões | Health check com `pg_isready` |
| Docker não instalado | Script mostra mensagem de erro clara |

