# T-002 — PostgreSQL + Redis Docker Compose

## Objetivo

Configurar ambiente local de desenvolvimento com PostgreSQL 15+ e Redis 7+ via Docker Compose, com health checks, volumes persistentes e rede isolada.

---

## Decisões a Tomar (antes de começar)

| # | Decisão | Opção A | Opção B | Recomendação |
|---|---------|---------|---------|-------------|
| D1 | PostgreSQL version | 15.x | 16.x | **15.x** — mais testado com Rails 7.1 |
| Redis version | 7.x | 6.x | **7.x** — suporte a streams, melhor performance |
| Docker Compose version | v2 (native) | v1 (legacy) | **v2** — nativo no Docker Desktop |
| Network driver | bridge | host | **bridge** — mais isolado, funciona em todos OS |
| Volume mount | named volumes | bind mounts | **named volumes** — mais portável, funciona em Windows/Mac |

---

## Passo a Passo

### Passo 1 — Criar `docker-compose.yml`

```yaml
# docker-compose.yml
services:
  postgres:
    image: postgres:15-alpine
    container_name: carva_postgres
    environment:
      POSTGRES_DB: carva_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carva_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carva_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - carva_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: carva_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - carva_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - carva_network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

networks:
  carva_network:
    name: carva_network
    driver: bridge

volumes:
  carva_pg_data:
    name: carva_pg_data
  carva_redis_data:
    name: carva_redis_data
```

