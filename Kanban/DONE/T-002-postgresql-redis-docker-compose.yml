### Passo 3 — Configurar Rails para usar Docker services

```ruby
# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { "5432" } %>
  database: <%= ENV.fetch("DATABASE_NAME") { "carva_dev" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default

test:
  <<: *default
  database: carva_test

production:
  <<: *default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
```

```ruby
# config/redis.yml
default: &default
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/0" } %>
  pool: 5

development:
  <<: *default

test:
  <<: *default
  pool: 5

production:
  <<: *default
  pool: 10
```

### Passo 4 — Criar script de setup

```bash
# bin/docker-setup
#!/usr/bin/env bash
set -e

echo "🐳 Starting Carva Docker environment..."

# Start services
docker compose up -d postgres redis

# Wait for PostgreSQL to be ready
echo "⏳ Waiting for PostgreSQL..."
until docker exec carva_postgres pg_isready -U postgres -d carva_dev; do
  sleep 1
done
echo "✅ PostgreSQL ready"

# Wait for Redis to be ready
echo "⏳ Waiting for Redis..."
until docker exec carva_redis redis-cli ping | grep -q PONG; do
  sleep 1
done
echo "✅ Redis ready"

# Create databases
echo "🗄️  Creating databases..."
docker exec carva_postgres psql -U postgres -d carva_dev -c "CREATE DATABASE carva_test;" 2>/dev/null || true

echo "✅ Environment ready!"
echo ""
echo "  PostgreSQL: postgres://postgres:postgres@localhost:5432/carva_dev"
echo "  Redis:      redis://localhost:6379/0"
```

```bash
# bin/docker-teardown
#!/usr/bin/env bash
set -e
echo "🐳 Stopping Carva Docker environment..."
docker compose down
echo "✅ Stopped!"
```

```bash
# bin/docker-reset
#!/usr/bin/env bash
set -e
echo "🐳 Resetting Carva Docker environment..."
docker compose down -v
docker compose up -d
sleep 5
echo "✅ Reset complete!"
```

### Passo 5 — Tornar scripts executáveis

```bash
chmod +x bin/docker-setup
chmod +x bin/docker-teardown
chmod +x bin/docker-reset
```

