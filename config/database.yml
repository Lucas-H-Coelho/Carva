# ============================================================
# Carva — database.yml
# ============================================================
# PostgreSQL via Docker Compose (localhost:5432)
# ============================================================

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { "5432" } %>
  database: <%= ENV.fetch("DATABASE_NAME") { "carva_dev" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: carva_dev

test:
  <<: *default
  database: carva_test

production:
  <<: *default
  database: <%= ENV.fetch("CARVA_DATABASE_NAME") { "carva_production" } %>
  username: <%= ENV.fetch("CARVA_DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("CARVA_DATABASE_PASSWORD") { nil } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
